name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint pushed commit
        if: github.event_name == 'push'
        run: bunx --no-install commitlint --last --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: bunx --no-install commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint PR title (becomes the squash-merge commit)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --no-install commitlint --verbose

  biome:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx --no-install biome ci .

  processor:
    name: Processor tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install libarchive (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev pkg-config
      - name: Install libarchive (macOS)
        if: runner.os == 'macOS'
        run: brew install libarchive pkg-config
      - run: make -C payload/processor test
      - name: Install image tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y makefs exfatprogs exfat-fuse fuse3 rsync
      - name: Read param.json from generated images
        if: runner.os == 'Linux'
        run: |
          images="$(sh payload/processor/tests/make_images.sh "$RUNNER_TEMP/images")"
          RAIJU_TEST_IMAGES="$images" make -C payload/processor test

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y aria2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd ui test

  build:
    uses: ./.github/workflows/build.yml
