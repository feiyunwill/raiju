name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  PS5_PAYLOAD_SDK_VERSION: v0.44

jobs:
  detect:
    name: Detect parts
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.parts.outputs.ui }}
      payload: ${{ steps.parts.outputs.payload }}
    steps:
      - uses: actions/checkout@v4
      - id: parts
        run: |
          echo "ui=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "payload=$([ -f payload/Makefile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ui:
    name: Web UI
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd ui build
      - run: bun run --cwd ui size
      - run: mkdir -p dist && (cd ui/dist && zip -r ../../dist/raiju-ui.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: |
            ui/dist
            dist/raiju-ui.zip

  payload:
    name: PS5 payload
    runs-on: ubuntu-latest
    needs: [detect, ui]
    if: ${{ !cancelled() && needs.detect.outputs.payload == 'true' && needs.ui.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.ui.result == 'success'
        with:
          name: ui
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 cmake meson pkg-config perl
      - name: Install ps5-payload-sdk ${{ env.PS5_PAYLOAD_SDK_VERSION }}
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/${PS5_PAYLOAD_SDK_VERSION}/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
      - name: Build zlib and OpenSSL for the console
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: sh payload/third_party/build-tls.sh
      - name: Build libarchive and its decoders for the console
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: sh payload/third_party/build-libarchive.sh
      - name: Build aria2 and libaria2 for the console
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: sh payload/third_party/build-aria2.sh
      - name: Build raiju.elf
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make -C payload
          mkdir -p dist && cp payload/raiju.elf dist/
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: dist/raiju.elf
